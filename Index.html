function dsvCalc(){const R=Math.PI/180,rows=S.dsv.map(r=>({...r}));let tv=0,N=0,E=0,pi=0,pa=0,pm=0;const out=[];
 rows.forEach((r,k)=>{const I=(r.i||0)*R,A=(r.a||0)*R;if(k){const I1=pi*R,A1=pa*R,dl=Math.max(r.z-pm,1e-6);
  const beta=Math.acos(Math.max(-1,Math.min(1,Math.cos(I1)*Math.cos(I)+Math.sin(I1)*Math.sin(I)*Math.cos(A-A1))));
  const rf=beta>1e-9?(beta/2)/Math.tan(beta/2):1;
  tv+=dl/2*(Math.cos(I1)+Math.cos(I))*rf;N+=dl/2*(Math.sin(I1)*Math.cos(A1)+Math.sin(I)*Math.cos(A))*rf;E+=dl/2*(Math.sin(I1)*Math.sin(A1)+Math.sin(I)*Math.sin(A))*rf;
  r.dls=beta/dl*100;r.bl=(r.i-pi)/dl*100;let da=A-A1;da=((da+Math.PI*3)%(Math.PI*2))-Math.PI;r.tn=da/dl*100}else{r.dls=0;r.bl=0;r.tn=0}
  r.tv=tv;r.n=N;r.e=E;r.cl=Math.hypot(N,E);r.azc=Math.atan2(E,N)/R;r.vs=r.cl*Math.cos((r.azc-(P.vsAz||0))*R);pi=r.i||0;pa=r.a||0;pm=r.z;out.push(r)});
 return out}

 m.addEventListener('pointerdown',e=>{if(e.target===m){m.remove();return}});
 $('#kX').onclick=()=>m.remove();
 const d=$('#kDisp');let mem=0;
 const ev=ex=>{try{const r=Function('"use strict";const sqrt=Math.sqrt,PI=Math.PI;return('+ex+')')();return isFinite(r)?+r.toFixed(10):'Error'}catch(e){return 'Error'}};
 bx.addEventListener('click',e=>{const btn=e.target.closest('button[data-k]');if(!btn)return;const k=btn.dataset.k;let x=d.value;
  if(k==='C')x='0';else if(k==='⌫')x=x.length>1?x.slice(0,-1):'0';
  else if(k==='=')x=String(ev(x.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'PI').replace(/√/g,'sqrt').replace(/x²/g,'**2').replace(/([^)]*)%/g,'($1/100)')));
  else if(k==='±')x=x.startsWith('-')?x.slice(1):'-'+x;
  else if(k==='M+')mem+=parseFloat(x)||0;else if(k==='MR')x=String(mem);else if(k==='⌫M')mem=0;
  else if(k==='⌗sqrt')x=String(Math.sqrt(parseFloat(x)||0));
  else if(k==='1/x')x=parseFloat(x)?String(1/parseFloat(x)):'Error';
  else{if(x==='0'&&!'+×÷−.'.includes(k))x='';x+=k}
  d.value=x});
 dragEl('kDrag','kBox',m);
}
$('#bC').onclick=cvModal;
$('#bK').onclick=calcModal;

/* ---------- input wiring (data-k fields, tables) ---------- */
function refreshAll(){['cemUpd','cem2Upd','mixUpd','pillUpd','motUpd','npUpd','strUpd','dsvUpd','dxUpd','dcUpd2','tankUpd','gasUpd','killUpd','planUpd','planUpd0'].forEach(f=>{try{if(typeof window[f]==='function')window[f]()}catch(err){}})}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.matches('#view [data-k]')){
  const k=t.dataset.k,def=IN[k];if(!def)return;
  if(def[2]==='sel')S[k]=t.value;
  else if(def[2]==='txt')S[k]=t.value;
  else{const v=parseFloat(t.value);S[k]=isFinite(v)?toF(def[1],v):null}
  save();rebuild();refreshAll();
 }
 if(t.matches('#dxt [data-r]')){const i=+t.dataset.r,c=t.dataset.c;if(!S.dx[i])return;
  if(c==='use')S.dx[i].use=t.checked;else{const v=parseFloat(t.value);S.dx[i][c]=isFinite(v)?toF(dxK[c],v):null}save();dxUpd()}
 if(t.matches('#pmt [data-i]')){const i=+t.dataset.i,c=t.dataset.c,p=S.pumps[i];if(!p)return;
  if(c==='on')p.on=t.checked;else if(c==='pt')p.pt=t.value;else{const v=parseFloat(t.value),kd=(c==='od'||c==='st'||c==='rd')?'dia':(c==='mp'?'press':null);p[c]=isFinite(v)?toF(kd,v):0}save();pumpRes()}
 if(t.matches('#stt [data-sti]')){const i=+t.dataset.sti,c=t.dataset.c,r=S.str[i];if(!r)return;
  if(c==='t')r.t=t.value;else{const v=parseFloat(t.value);r[c]=isFinite(v)?v:null}save();rebuild();strLive();return}
 if(t.matches('#cgt [data-cgi]')){const i=+t.dataset.cgi,c=t.dataset.c,r=S.csgs[i];if(!r)return;
  if(c==='t')r.t=t.value;else{const v=parseFloat(t.value);r[c]=isFinite(v)?v:null}save();rebuild();cgLive();return}
 if(t.matches('[data-rt]')){const s=t.dataset.rt,i2=+t.dataset.ri,c=t.dataset.c,r=S[s][i2];if(!r)return;const v=parseFloat(t.value);r[c]=isFinite(v)?v:null;save();rebuild();tubRefLive(s);return}
 if(t.matches('#dct [data-cr]')){const i=+t.dataset.cr,c=t.dataset.c,r=S.dcs[i];if(!r)return;
  const v=parseFloat(t.value);r[c]=isFinite(v)?toF('dia',v):0;save();dcRes();dcUpd2()}
 if(t.matches('#dst [data-sr]')){const i=+t.dataset.sr,c=t.dataset.c,r=S.dsv[i];if(!r)return;
  if(c==='i'||c==='a'){const v=parseFloat(t.value);r[c]=isFinite(v)?v:0}else{const v=parseFloat(t.value);r[c]=isFinite(v)?toF('len',v):null}
  save();dsvUpd()}
 if(t.matches('[data-ti]')){const i=+t.dataset.ti,c=t.dataset.c,tk=S.tanks[i];if(!tk)return;
  if(c==='on')tk.on=t.checked;else if(c==='ty'||c==='n')tk[c]=t.value;else{const v=parseFloat(t.value);tk[c]=isFinite(v)?toF('len',v):null}
  save();tankUpd()}
});
/* v21: theme-styled custom dropdowns for ALL native selects (delegated — covers dynamically added table rows too) */
document.addEventListener('pointerdown',e=>{
  const s=e.target.closest('select[data-k],select[data-ti],select[data-c],select[data-sti],select[data-cgi],select[data-i]');
  if(!s)return;
  e.preventDefault();
  const opts=[...s.options].map(o=>[o.value,o.textContent]);
  if(!opts.length)return;
  ddOpen(s,()=>opts.map(o=>`<div class="ddI ${o[0]===s.value?'on':''}" data-v="${(o[0]+'').replace(/"/g,'&quot;')}">${o[1]}</div>`).join(''));
  const m=document.getElementById('ddMenu');
  if(m)m.onclick=ev=>{const it=ev.target.closest('.ddI');if(!it)return;s.value=it.dataset.v;s.dispatchEvent(new Event('input',{bubbles:true}));s.dispatchEvent(new Event('change',{bubbles:true}));ddClose()};
},true);

document.addEventListener('change',e=>{
 const t=e.target;
 if(t.matches('#view [data-k]')&&IN[t.dataset.k]&&(IN[t.dataset.k][2]==='sel')){save()}
 if(t.matches('#dxt [data-r]')&&t.dataset.c==='use'){S.dx[+t.dataset.r].use=t.checked;save();dxUpd()}
 if(t.matches('#pmt [data-i]')&&t.tagName==='SELECT'){pumpTable()}
 if(t.matches('#stt [data-sti]')&&t.tagName==='SELECT'){strDraw()}
 if(t.matches('#cgt [data-cgi]')&&t.tagName==='SELECT'){cgDraw()}
 if(t.matches('[data-ti]')&&(t.dataset.c==='on'||t.dataset.c==='ty')){render()}
});
document.addEventListener('click',e=>{
 const st=e.target.closest('[data-stdel]');if(st){S.str.splice(+st.dataset.stdel,1);save();strDraw();return}
 const cg=e.target.closest('[data-cgdel]');if(cg){S.csgs.splice(+cg.dataset.cgdel,1);save();cgDraw();return}
 const rd=e.target.closest('[data-rtdel]');if(rd){const sk=rd.dataset.rtdel.split(':')[0],ix=+rd.dataset.rtdel.split(':')[1];S[sk].splice(ix,1);save();tubRefDraw(sk);return}
 const d=e.target.closest('[data-del]');if(d){S.dx.splice(+d.dataset.del,1);save();dxTable();dxUpd();return}
 const pd=e.target.closest('[data-pdel]');if(pd){S.pumps.splice(+pd.dataset.pdel,1);save();pumpTable();return}
 const cd=e.target.closest('[data-cdel]');if(cd){S.dcs.splice(+cd.dataset.cdel,1);save();dcTable();dcUpd2();return}
 const sd=e.target.closest('[data-sdel]');if(sd){S.dsv.splice(+sd.dataset.sdel,1);save();dsvTable();dsvUpd();return}
});
const ENX=v=>String(v).replace(/[\u200c\u06F0-\u06F9\u0660-\u0669\u061B\u060C\u061F\u00AB\u00BB\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/g,'').replace(/[ \t]{2,}/g,' ');
const _ihd=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
Object.defineProperty(Element.prototype,'innerHTML',{set(v){_ihd.set.call(this,ENX(v))},get(){return _ihd.get.call(this)}});
document.documentElement.dataset.theme=S._th||'dark';
render();
